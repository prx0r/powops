  - id: pvlive
    garden: powuk
    authority: Sheffield Solar / PV Live
    type: api
    description: Actual UK solar output (hourly)
    cadence: hourly
    health:
      check: raw_mtime
      directory: data/raw/pvlive
      max_staleness: 48h

  - id: planning_apps
    garden: powuk
    authority: Planning Data
    type: api
    description: UK planning applications (2h)
    cadence: 2h
    health:
      check: raw_mtime
      directory: data/raw/planning_apps
      max_staleness: 48h

  - id: ons_labour
    garden: powuk
    authority: Office for National Statistics
    type: csv
    description: UK labour market data (175K rows)
    cadence: daily
    health:
      check: raw_mtime
      directory: data/raw/ons_labour
      max_staleness: 168h

  - id: apar
    garden: powuk
    authority: Education and Skills Funding Agency
    type: api
    description: UK training providers (1,432)
    cadence: daily
    health:
      check: raw_mtime
      directory: data/raw/apar
      max_staleness: 168h

  - id: ofqual
    garden: powuk
    authority: Ofqual
    type: api
    description: UK qualifications register (10,000)
    cadence: daily
    health:
      check: raw_mtime
      directory: data/raw/ofqual
      max_staleness: 168h

  - id: contracts_finder
    garden: powuk
    authority: Contracts Finder
    type: api
    description: UK public procurement (2h)
    cadence: 2h
    health:
      check: raw_mtime
