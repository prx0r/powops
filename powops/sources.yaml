# sources.yaml — Universal Source Manifest for POW Gardens
#
# Every data source across all Layer 1 gardens, declared once.
# powops reads this to know what to monitor and how.
#
# Health check types:
#   heartbeat    — reads a JSON file with "heartbeat_at" timestamp
#   collector_db — queries a SQLite collector_run table
#   raw_mtime    — checks file modification times in a raw directory
#   pid_file     — checks if a PID file contains a live process
#   http         — hits an HTTP endpoint (future)
#
# Alert states: ok → alerting (fires webhook) → ok (fires recovery)

alerting:
  enabled: true
  # Default webhook for all sources (override per-source)
  default_webhook: null
  # Suppress repeated alerts within this window
  suppress_window: 30m

gardens:
  powpowpow:
    path: /home/ubuntu/powpowpow
    description: PoW chain compute / crypto-resource telemetry
    health_check: heartbeat_files
    storage: warehouse/raw/

  repair:
    path: /home/ubuntu/repair
    description: Physical asset / failure / parts / resale telemetry
    health_check: collector_db
    db_path: warehouse/repair.db
    storage: warehouse/

  powuk:
    path: /home/ubuntu/powuk
    description: UK physical capacity / labour / infrastructure / policy
    health_check: raw_mtime
    storage: data/raw/

  powstock:
    path: /home/ubuntu/powstock
    description: UK public-market / corporate / ownership / microstructure
    health_check: raw_mtime
    storage: data/raw/

sources:
  # ═══════════════════════════════════════════════════════════
  # POWPOWPOW — compute / PoW chain telemetry
  # ═══════════════════════════════════════════════════════════

  - id: chain_state
    garden: powpowpow
    authority: Multi-chain RPC
    type: rpc
    description: Live network state poller (QUBIC, XMR, KAS, AKT, NOCK)
    cadence: 300s
    health:
      check: heartbeat
      file: warehouse/chain_state_heartbeat.json
      max_staleness: 10m
      expect_keys: ["heartbeat_at"]
    alert:
      enabled: true
      severity:
        stale: true
        error: true
      # webhook: https://your-webhook-url

  - id: venue_l2
    garden: powpowpow
    authority: CoinEx/Gate/MEXC
    type: rest
    description: REST L2 order books, tickers, and trades
    cadence: 30s
    health:
      check: heartbeat
      file: warehouse/venue_l2_heartbeat.json
      max_staleness: 5m
      expect_keys: ["heartbeat_at"]
    alert:
      enabled: true
      severity:
        stale: true
        error: true

  - id: venue_ws
    garden: powpowpow
    authority: CoinEx/Gate WebSocket
    type: websocket
    description: Real-time tick archive (trades + orderbook snapshots)
    cadence: realtime
    health:
      check: heartbeat
      file: warehouse/venue_ws_heartbeat.json
      max_staleness: 2m
      expect_keys: ["heartbeat_at"]
    alert:
      enabled: true
      severity:
        stale: true
        error: true

  - id: qubic_collector
    garden: powpowpow
    authority: Qubic RPC
    type: rpc
    description: QUBIC tick, status, epoch, and contract data
    cadence: 300s
    health:
      check: heartbeat
      file: warehouse/chain_state_heartbeat.json
      max_staleness: 10m

  - id: prl_collector
    garden: powpowpow
    authority: PearlTrack
    type: rest
    description: PRL mining stats and derived labels
    cadence: 300s
    health:
      check: heartbeat
      file: warehouse/chain_state_heartbeat.json
      max_staleness: 10m

  - id: xmr_collector
    garden: powpowpow
    authority: LocalMonero/CoinGecko
    type: rest
    description: Monero network and price data
    cadence: 120s
    health:
      check: heartbeat
      file: warehouse/chain_state_heartbeat.json
      max_staleness: 10m

  - id: clore_collector
    garden: powpowpow
    authority: Clore AI
    type: rest
    description: Clore marketplace and mining telemetry
    cadence: 300s
    health:
      check: heartbeat
      file: warehouse/chain_state_heartbeat.json
      max_staleness: 10m

  # ═══════════════════════════════════════════════════════════
  # REPAIR — physical asset / failure / parts / resale
  # ═══════════════════════════════════════════════════════════

  - id: open_repair
    garden: repair
    authority: Open Repair Alliance
    type: bulk_csv
    description: 305K+ repair records from Open Repair Alliance
    cadence: 24h
    health:
      check: collector_db
      source_id: open_repair
      max_staleness: 48h

  - id: ebay_uk
    garden: repair
    authority: eBay UK
    type: scrape
    description: UK eBay listings for repair/parts pricing
    cadence: 6h
    health:
      check: collector_db
      source_id: ebay_uk
      max_staleness: 12h

  - id: dvla
    garden: repair
    authority: DVLA
    type: api
    description: UK vehicle registration and MOT data
    cadence: 24h
    health:
      check: collector_db
      source_id: dvla
      max_staleness: 48h

  - id: land_registry
    garden: repair
    authority: HM Land Registry
    type: csv
    description: UK property transaction data
    cadence: 24h
    health:
      check: collector_db
      source_id: land_registry
      max_staleness: 48h

  - id: planning_data
    garden: repair
    authority: Planning Data
    type: api
    description: UK planning applications and approvals
    cadence: 24h
    health:
      check: collector_db
      source_id: planning_data
      max_staleness: 48h

  - id: eprel
    garden: repair
    authority: EU EPREL
    type: api
    description: EU product energy register
    cadence: 24h
    health:
      check: collector_db
      source_id: eprel
      max_staleness: 48h

  - id: france_repairability
    garden: repair
    authority: France Repairability
    type: api
    description: French repairability index scores
    cadence: 24h
    health:
      check: collector_db
      source_id: france_repairability
      max_staleness: 48h

  # ═══════════════════════════════════════════════════════════
  # POWUK — UK physical capacity / labour / infrastructure
  # ═══════════════════════════════════════════════════════════

  - id: neso_demand
    garden: powuk
    authority: National Grid ESO
    type: api
    description: UK electricity demand (hourly)
    cadence: hourly
    health:
      check: raw_mtime
      directory: data/raw/neso_demand
      max_staleness: 48h

  - id: neso_generation
    garden: powuk
    authority: National Grid ESO
    type: api
    description: UK generation mix — wind/solar/gas (hourly)
    cadence: hourly
    health:
      check: raw_mtime
      directory: data/raw/neso_generation
