[project]
name = "powops"
version = "0.1.0"
description = "Layer 1 command centre for POW gardens"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
powops = "powops.__main__:main"

[tool.setuptools.packages.find]
include = ["powops*"]
exclude = ["tests*", "deploy*", "history*", "volume*", "schemas*"]
